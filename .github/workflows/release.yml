name: Release

# Publishes on a pushed tag. Auth is npm Trusted Publishing (OIDC): the package
# on npmjs.com names Booyaka101/agent-plugins-conformance-kit + release.yml as
# its trusted publisher, so the id-token: write permission is the whole
# credential and provenance is attached automatically.
#
# Trusted publishing needs npm >= 11.5.1, newer than the npm bundled with Node
# 22, hence the explicit upgrade step. Without it the publish fails with an auth
# error that reads like a bad token.
#
# v1.0.0 was published from a laptop before any of this was in place, so it has no
# provenance attestation. npm does not allow republishing a version, so that cannot
# be backfilled.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v1.0.1
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Meet the trusted-publishing version floor
        run: |
          set -euo pipefail
          npm install -g npm@^11.5.1
          node --version
          npm --version

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:sources

      # A tag that disagrees with package.json publishes the wrong thing under the right
      # name, and npm will not let you take it back.
      - name: The tag must match the version in package.json
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="v$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$version"
          test "$tag" = "$version"

      - run: npm publish --access public

      - name: Wait for the registry to serve it
        run: |
          version="$(node -p "require('./package.json').version")"
          for _ in $(seq 1 30); do
            npm view "agent-plugins-conformance-kit@$version" version && exit 0
            sleep 10
          done
          echo "the registry did not serve $version within five minutes"
          exit 1
